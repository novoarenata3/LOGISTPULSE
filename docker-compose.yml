services:
  logistpulse-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: logistpulse-app
    restart: unless-stopped
    ports:
      - "${PORT:-4000}:${PORT:-4000}"
    environment:
      PORT: ${PORT:-4000}
      DB_HOST: ${DB_HOST:-logistpulse-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-logistpulse_pass}
      DB_NAME: ${DB_NAME:-logistpulse_db}
    depends_on:
      logistpulse-db:
        condition: service_healthy

  logistpulse-db:
    image: postgres:15-alpine
    container_name: logistpulse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-logistpulse_pass}
      POSTGRES_DB: ${DB_NAME:-logistpulse_db}
    volumes:
      - logistpulse_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-logistpulse_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  logistpulse_data:
